<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerFit Gym</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <h2>PowerFit</h2>
  <div class="links">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<section id="home" class="hero">
  <div class="hero-content">
    <h1>Train Smart. Look Strong.</h1>
    <p>Premium Fitness Experience</p>
    <button onclick="scrollToSection('contact')">Get Started</button>
  </div>
</section>

<section id="about" class="section hidden">
  <h2>About Us</h2>
  <p>We deliver world-class fitness training with modern equipment.</p>
</section>

<section id="services" class="section hidden">
  <h2>Our Services</h2>
  <div class="grid">
    <div class="card">💪 Personal Training</div>
    <div class="card">🔥 Fat Loss</div>
    <div class="card">🏋️ Strength Training</div>
  </div>
</section>

<section id="contact" class="section hidden">
  <h2>Contact</h2>
  <form id="form">
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>
